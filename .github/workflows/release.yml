name: Release desktop app

# Builds the Mac + Windows installers on GitHub's runners and publishes a
# GitHub Release automatically. Runs whenever package.json changes on main
# (i.e. after a version bump) and can also be started by hand from the Actions
# tab (Run workflow). Users' apps then auto-update from the published release —
# no one has to run pack:release or gh release create locally.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      needed: ${{ steps.exists.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: get
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.get.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${{ steps.get.outputs.version }} already exists — nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-mac:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build macOS installers (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/EnvisionMail-*-mac-*.dmg
            release/EnvisionMail-*-mac-*.zip
            release/latest-mac.yml

  build-win:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build Windows installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win
          if-no-files-found: error
          path: |
            release/EnvisionMail-*-win-*-Setup.exe
            release/latest.yml

  publish:
    needs: [version, build-mac, build-win]
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Extract release notes from UPDATES.md
        run: |
          VER="${{ needs.version.outputs.version }}"
          awk -v ver="## $VER" '$0==ver {flag=1; next} /^## / && flag {exit} flag {print}' UPDATES.md > notes.md
          if [ ! -s notes.md ]; then echo "Envision Mail $VER" > notes.md; fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          gh release create "v$VER" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Envision Mail $VER" \
            --notes-file notes.md \
            --latest \
            dist/mac/* dist/win/*
